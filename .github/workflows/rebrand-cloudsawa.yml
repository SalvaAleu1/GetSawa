name: CloudSawa rebrand migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebrand-cloudsawa.yml"

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace legacy GetSawa branding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path(".")
          skip_parts = {".git", "node_modules", ".next", ".open-next"}\n          workflow_dir = Path(".github/workflows")
          protected_repo = "SalvaAleu1/GetSawa"
          sentinel = "__CLOUDSAWA_GITHUB_REPO__"
          changed = []

          for path in root.rglob("*"):
              if not path.is_file() or any(part in skip_parts for part in path.parts):
                  continue
              try:
                  raw = path.read_bytes()
                  text = raw.decode("utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              updated = text.replace(protected_repo, sentinel)
              updated = updated.replace("GETSAWA", "CLOUDSAWA")
              updated = updated.replace("GetSawa", "CloudSawa")
              updated = updated.replace("getsawa", "cloudsawa")
              updated = updated.replace(sentinel, protected_repo)

              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          print(f"Updated {len(changed)} text files.")
          for item in changed:
              print(item)
          PY

      - name: Keep pre-domain deployment safe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          patches = {
              "src/app/layout.tsx": [
                  ('const appUrl = process.env.APP_URL || "https://cloudsawa.app";',
                   'const appUrl = process.env.APP_URL || "http://localhost:3000";'),
              ],
              "scripts/ops/deploy-cloudflare.sh": [
                  ('if [[ "${APP_URL:-}" == "https://cloudsawa.app" ]]; then unset APP_URL; fi',
                   'if [[ "${APP_URL:-}" == "https://cloudsawa.app" || "${APP_URL:-}" == "https://cloudsawa.com" ]]; then unset APP_URL; fi'),
                  ('if [[ "${WEBSITE_PLATFORM_HOST:-}" == "cloudsawa.app" ]]; then unset WEBSITE_PLATFORM_HOST; fi',
                   'if [[ "${WEBSITE_PLATFORM_HOST:-}" == "cloudsawa.app" || "${WEBSITE_PLATFORM_HOST:-}" == "cloudsawa.com" ]]; then unset WEBSITE_PLATFORM_HOST; fi'),
              ],
          }

          for filename, replacements in patches.items():
              path = Path(filename)
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit CloudSawa migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No legacy branding remained."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: rebrand platform from GetSawa to CloudSawa"
          git push origin main
